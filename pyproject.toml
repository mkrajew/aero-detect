[project]
name = "aerodetect"
version = "0.0.1"
description = "AeroDetect: Benchmarking YOLO and Faster R-CNN for Aerial Object Detection"
authors = [{ name = "mkrajew" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

requires-python = "~=3.12.0"
dependencies = [
  "hydra-core>=1.3.2",
  "kagglehub>=1.0.0",
  "loguru",
  "numpy>=2.4.6",
  "pandas>=3.0.3",
  "pip",
  "pycocotools>=2.0.11",
  "python-dotenv",
  "ruff",
  "tqdm",
  "typer",
  "tensorboard>=2.20.0",
  "torch==2.8.0",
  "torchmetrics>=1.9.0",
  "torchvision==0.23.0",
  "tqdm",
  "typer",
  "ultralytics>=8.4.54",
  "wandb>=0.27.0",
]



[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[project.scripts]
dataset = "aerodetect.dataset:app"
process = "aerodetect.modeling.process:app"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 99
src = ["aerodetect"]
include = ["pyproject.toml", "aerodetect/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"] # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["aerodetect"]
force-sort-within-sections = true

